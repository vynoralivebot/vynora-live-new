<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VYNORA LIVE - Real Connections</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.17.0.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#6366f1',
                        darkbg: '#090d16',
                        cardbg: '#131c31',
                        cardborder: '#1e293b',
                        accentpink: '#ec4899'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkbg text-slate-100 font-sans min-h-screen flex flex-col antialiased selection:bg-pink-500 selection:text-white pb-24">

    <!-- Top Professional Header -->
    <header class="bg-cardbg/90 backdrop-blur-xl border-b border-cardborder px-4 py-3 flex justify-between items-center sticky top-0 z-50 shadow-xl">
        <div class="flex items-center space-x-3">
            <div class="bg-gradient-to-tr from-pink-500 via-purple-600 to-indigo-600 p-2.5 rounded-2xl text-white font-black text-sm shadow-lg flex items-center justify-center tracking-wider">VL</div>
            <div>
                <h1 class="font-black text-transparent bg-clip-text bg-gradient-to-r from-pink-400 via-purple-300 to-indigo-400 tracking-wide text-sm">VYNORA LIVE</h1>
                <p id="userRoleBadge" class="text-[9px] text-slate-400 font-semibold tracking-widest uppercase">USER DASHBOARD</p>
            </div>
        </div>
        <div class="flex items-center space-x-3">
            <div id="walletBadge" class="hidden bg-slate-900/90 border border-cardborder px-3 py-1.5 rounded-full flex items-center space-x-2 shadow-inner">
                <i class="fa-solid fa-coins text-yellow-400 text-xs"></i>
                <span id="tokenBalanceCount" class="font-extrabold text-xs text-yellow-300">0</span>
            </div>
            <div id="userAvatarHeader" class="w-9 h-9 bg-gradient-to-tr from-pink-500 to-indigo-600 rounded-full flex items-center justify-center font-bold text-xs shadow-lg border border-pink-400/30 text-white">U</div>
        </div>
    </header>

    <!-- Main Dynamic Container -->
    <main id="appContainer" class="flex-1 p-4 max-w-md mx-auto w-full space-y-4">
        <div id="loadingView" class="flex flex-col items-center justify-center py-32 space-y-4">
            <div class="animate-spin rounded-full h-10 w-10 border-t-2 border-b-2 border-pink-500"></div>
            <p class="text-slate-400 text-xs tracking-wider animate-pulse font-medium">Securing Connection...</p>
        </div>
    </main>

    <!-- Bottom Professional Navigation Bar (Includes Profile) -->
    <nav id="bottomNav" class="hidden fixed bottom-0 left-0 right-0 bg-cardbg/95 backdrop-blur-xl border-t border-cardborder px-2 py-2 flex justify-around items-center z-50 max-w-md mx-auto shadow-2xl">
        <!-- Dynamically injected -->
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let currentUser = null;
        let currentRole = 'user';
        const API_BASE = window.location.origin;
        const initData = tg.initData || "query_id=AAHd-1gSAAAAANv3VBM&user=%7B%22id%22%3A7778606261%2C%22first_name%22%3A%22Rajnish%22%2C%22username%22%3A%22rajnish%22%7D&auth_date=1658145223&hash=abc";

        async function apiCall(endpoint, method = 'GET', data = null, isForm = false) {
            const headers = { 'initData': initData };
            let options = { method, headers };
            if (data) {
                if (isForm) {
                    options.body = data;
                } else {
                    headers['Content-Type'] = 'application/json';
                    options.body = JSON.stringify(data);
                }
            }
            try {
                const res = await fetch(`${API_BASE}${endpoint}`, options);
                const json = await res.json();
                if (!res.ok) throw new Error(json.detail || 'API Error');
                return json;
            } catch (err) {
                console.error(err);
                alert(err.message);
                return null;
            }
        }

        async function initApp() {
            const res = await apiCall('/api/auth/verify', 'POST', { initData });
            if (!res) return;
            currentUser = res;
            currentRole = res.role;

            document.getElementById('walletBadge').classList.remove('hidden');
            document.getElementById('tokenBalanceCount').innerText = res.tokens || 0;
            document.getElementById('userRoleBadge').innerText = currentRole.toUpperCase() + ' DASHBOARD';
            document.getElementById('userAvatarHeader').innerText = (res.name || 'U').charAt(0).toUpperCase();

            renderNavigation();
            loadUserDashboard();
        }

        function renderNavigation() {
            const nav = document.getElementById('bottomNav');
            nav.classList.remove('hidden');
            nav.innerHTML = `
                <button onclick="loadUserDashboard()" class="flex flex-col items-center text-pink-500 py-1 px-3 rounded-xl transition"><i class="fa-solid fa-house text-sm"></i><span class="text-[10px] mt-1 font-bold">Home</span></button>
                <button onclick="loadUserBookings()" class="flex flex-col items-center text-slate-400 hover:text-white py-1 px-3 rounded-xl transition"><i class="fa-solid fa-calendar-check text-sm"></i><span class="text-[10px] mt-1 font-semibold">Bookings</span></button>
                <button onclick="loadWalletView()" class="flex flex-col items-center text-slate-400 hover:text-white py-1 px-3 rounded-xl transition"><i class="fa-solid fa-wallet text-sm"></i><span class="text-[10px] mt-1 font-semibold">Recharge</span></button>
                <button onclick="loadProfileView()" class="flex flex-col items-center text-slate-400 hover:text-white py-1 px-3 rounded-xl transition"><i class="fa-solid fa-user text-sm"></i><span class="text-[10px] mt-1 font-semibold">Profile</span></button>
            `;
        }

        async function loadUserDashboard() {
            const container = document.getElementById('appContainer');
            container.innerHTML = `<div class="text-center py-24"><div class="animate-spin h-8 w-8 border-2 border-pink-500 rounded-full mx-auto"></div></div>`;
            const res = await apiCall('/api/hosts', 'GET', null);
            if (!res) return;

            let hostsHtml = '';
            res.hosts.forEach(host => {
                hostsHtml += `
                    <div class="bg-cardbg border border-cardborder rounded-2xl p-3 flex flex-col justify-between shadow-xl relative overflow-hidden group">
                        <div class="relative rounded-xl overflow-hidden bg-slate-900 h-44 flex items-center justify-center">
                            <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-transparent to-transparent opacity-80 z-10"></div>
                            <div class="text-3xl font-black text-slate-700">${host.name.charAt(0)}</div>
                            <div class="absolute top-2 left-2 z-20 bg-emerald-500/90 backdrop-blur-md text-[10px] px-2 py-0.5 rounded-full font-bold flex items-center space-x-1 shadow">
                                <span class="w-1.5 h-1.5 bg-white rounded-full animate-pulse"></span>
                                <span>Online</span>
                            </div>
                            <div class="absolute bottom-2 left-2 z-20">
                                <h4 class="font-extrabold text-xs text-white">${host.name} <i class="fa-solid fa-circle-check text-blue-400 text-[10px]"></i></h4>
                                <p class="text-[10px] text-slate-300"><i class="fa-solid fa-location-dot text-pink-400"></i> ${host.country}</p>
                            </div>
                        </div>
                        <div class="mt-3 flex items-center justify-between">
                            <span class="text-xs font-black text-pink-400">₹${host.call_rate || 20}/min</span>
                            <button onclick="bookHost('${host.user_id}', '${host.name}', ${host.call_rate || 20}, '${host.country}')" class="bg-gradient-to-r from-pink-500 to-indigo-600 px-3 py-1.5 rounded-xl text-[11px] font-bold shadow-lg hover:opacity-90 transition">Book Now</button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = `
                <div class="bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-900 border border-cardborder rounded-2xl p-4 flex justify-between items-center shadow-2xl relative overflow-hidden">
                    <div class="absolute -right-4 -bottom-4 w-24 h-24 bg-pink-500/10 rounded-full blur-2xl"></div>
                    <div>
                        <p class="text-[11px] text-slate-400 font-semibold tracking-wider">TOKEN BALANCE</p>
                        <div class="flex items-center space-x-2 mt-1">
                            <i class="fa-solid fa-coins text-yellow-400 text-xl"></i>
                            <span class="text-2xl font-black text-white">${currentUser.tokens || 0}</span>
                        </div>
                    </div>
                    <button onclick="loadWalletView()" class="bg-gradient-to-r from-pink-500 to-primary px-4 py-2.5 rounded-xl font-extrabold text-xs shadow-xl flex items-center space-x-2 active:scale-95 transition">
                        <i class="fa-solid fa-bolt text-yellow-300"></i>
                        <span>Recharge</span>
                    </button>
                </div>

                <div class="bg-cardbg border border-pink-500/30 rounded-2xl p-3 flex items-center space-x-3 shadow-lg">
                    <div class="bg-pink-500/20 p-2.5 rounded-xl text-pink-400"><i class="fa-solid fa-bullhorn text-sm"></i></div>
                    <div class="flex-1">
                        <h4 class="text-xs font-bold text-pink-400">Special Offer</h4>
                        <p class="text-[11px] text-slate-300">Get 20% Extra Tokens on every UPI recharge today!</p>
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-2.5">
                    <button onclick="loadUserBookings()" class="bg-cardbg border border-cardborder p-3 rounded-2xl flex flex-col items-center justify-center space-y-2 hover:border-pink-500/40 transition shadow">
                        <div class="bg-indigo-500/20 text-indigo-400 p-2.5 rounded-xl"><i class="fa-solid fa-calendar-check text-sm"></i></div>
                        <span class="text-[11px] font-bold text-slate-300">Bookings</span>
                    </button>
                    <button onclick="loadWalletView()" class="bg-cardbg border border-cardborder p-3 rounded-2xl flex flex-col items-center justify-center space-y-2 hover:border-pink-500/40 transition shadow">
                        <div class="bg-emerald-500/20 text-emerald-400 p-2.5 rounded-xl"><i class="fa-solid fa-wallet text-sm"></i></div>
                        <span class="text-[11px] font-bold text-slate-300">Wallet</span>
                    </button>
                    <button onclick="loadProfileView()" class="bg-cardbg border border-cardborder p-3 rounded-2xl flex flex-col items-center justify-center space-y-2 hover:border-pink-500/40 transition shadow">
                        <div class="bg-pink-500/20 text-pink-400 p-2.5 rounded-xl"><i class="fa-solid fa-user text-sm"></i></div>
                        <span class="text-[11px] font-bold text-slate-300">Profile</span>
                    </button>
                </div>

                <div class="pt-2">
                    <div class="flex items-center justify-between mb-3">
                        <h3 class="font-extrabold text-sm text-slate-200">Available India Hosts</h3>
                        <span class="text-xs font-semibold text-pink-400">Verified</span>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        ${hostsHtml}
                    </div>
                </div>
            `;
        }

        async function loadProfileView() {
            const container = document.getElementById('appContainer');
            container.innerHTML = `
                <div class="bg-cardbg border border-cardborder rounded-2xl p-5 shadow-2xl space-y-4">
                    <h2 class="text-sm font-extrabold text-pink-400 tracking-wide uppercase">User Profile</h2>
                    <div class="space-y-3">
                        <div class="bg-slate-900 p-3 rounded-xl border border-cardborder">
                            <p class="text-[10px] text-slate-400">Name</p>
                            <p class="text-xs font-bold text-white">${currentUser.name || 'User'}</p>
                        </div>
                        <div class="bg-slate-900 p-3 rounded-xl border border-cardborder">
                            <p class="text-[10px] text-slate-400">Username</p>
                            <p class="text-xs font-bold text-white">@${currentUser.username || 'N/A'}</p>
                        </div>
                        <div class="bg-slate-900 p-3 rounded-xl border border-cardborder">
                            <p class="text-[10px] text-slate-400">Telegram User ID</p>
                            <p class="text-xs font-bold text-white">${currentUser.user_id || 'N/A'}</p>
                        </div>
                        <div class="bg-slate-900 p-3 rounded-xl border border-cardborder">
                            <p class="text-[10px] text-slate-400">Token Balance</p>
                            <p class="text-xs font-bold text-yellow-400">${currentUser.tokens || 0} Tokens</p>
                        </div>
                        <button onclick="loadUserDashboard()" class="w-full bg-slate-800 py-2.5 rounded-xl font-bold text-xs text-slate-400">Back Home</button>
                    </div>
                </div>
            `;
        }

        function bookHost(hostId, hostName, rate, country) {
            if (country.toLowerCase() !== 'india') {
                alert("⚠️ यह Host book नहीं किया जा सकता। यह दूसरे country का Host है। अभी केवल India-based Hosts available हैं।");
                return;
            }
            const container = document.getElementById('appContainer');
            container.innerHTML = `
                <div class="bg-cardbg border border-cardborder rounded-2xl p-5 shadow-2xl space-y-4">
                    <h2 class="text-sm font-extrabold text-pink-400">Book Call with ${hostName}</h2>
                    <div class="space-y-3">
                        <div>
                            <label class="text-[11px] text-slate-400 font-semibold">Duration</label>
                            <select id="durationSelect" class="w-full bg-slate-900 border border-cardborder rounded-xl p-3 mt-1 text-xs font-bold text-white focus:outline-none focus:border-pink-500">
                                <option value="1">1 Minute (20 Tokens)</option>
                                <option value="5" selected>5 Minutes (100 Tokens)</option>
                                <option value="10">10 Minutes (200 Tokens)</option>
                                <option value="15">15 Minutes (300 Tokens)</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-[11px] text-slate-400 font-semibold">Date</label>
                            <input type="date" id="bookingDate" value="2026-09-20" class="w-full bg-slate-900 border border-cardborder rounded-xl p-3 mt-1 text-xs font-bold text-white">
                        </div>
                        <div>
                            <label class="text-[11px] text-slate-400 font-semibold">Time</label>
                            <input type="time" id="bookingTime" value="21:30" class="w-full bg-slate-900 border border-cardborder rounded-xl p-3 mt-1 text-xs font-bold text-white">
                        </div>
                        <button onclick="submitBooking('${hostId}')" class="w-full bg-gradient-to-r from-pink-500 to-indigo-600 py-3 rounded-xl font-extrabold text-xs shadow-lg mt-2 tracking-wider">CONFIRM BOOKING</button>
                        <button onclick="loadUserDashboard()" class="w-full bg-slate-800 py-2.5 rounded-xl font-bold text-xs text-slate-400">Back</button>
                    </div>
                </div>
            `;
        }

        async function submitBooking(hostId) {
            const duration = parseInt(document.getElementById('durationSelect').value);
            const date = document.getElementById('bookingDate').value;
            const timeVal = document.getElementById('bookingTime').value;

            const res = await apiCall('/api/booking/create', 'POST', {
                host_id: hostId,
                date: date,
                time: timeVal,
                duration_minutes: duration
            });

            if (res && res.status === 'success') {
                alert("Booking request successfully sent to host!");
                loadUserDashboard();
            }
        }

        async function loadWalletView() {
            const container = document.getElementById('appContainer');
            container.innerHTML = `
                <div class="bg-cardbg border border-cardborder rounded-2xl p-5 shadow-2xl space-y-4">
                    <h2 class="text-sm font-extrabold text-pink-400 tracking-wide uppercase">Recharge Wallet</h2>
                    <p class="text-xs text-slate-300">Scan QR or pay via UPI ID: <b class="text-yellow-400">vynoralive@slc</b> (Rajnish Kumar)</p>
                    
                    <div class="bg-slate-900/90 border border-cardborder rounded-2xl p-4 flex flex-col items-center justify-center space-y-2 shadow-inner">
                        <div class="bg-white p-2 rounded-xl shadow-md">
                            <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=upi://pay?pa=vynoralive@slc&pn=Rajnish%20Kumar" alt="UPI QR Code" class="w-36 h-36 rounded-lg">
                        </div>
                        <span class="text-[10px] text-emerald-400 font-bold tracking-wider uppercase"><i class="fa-solid fa-shield-halved mr-1"></i> Scan with GPay / PhonePe / Paytm</span>
                    </div>

                    <div class="space-y-3 pt-1">
                        <div>
                            <label class="text-[11px] text-slate-400 font-semibold">Amount (INR)</label>
                            <input type="number" id="rechargeAmount" value="100" class="w-full bg-slate-900 border border-cardborder rounded-xl p-3 mt-1 text-xs font-bold text-white focus:outline-none focus:border-pink-500">
                        </div>
                        <div>
                            <label class="text-[11px] text-slate-400 font-semibold">UTR / Transaction ID (12 Digits)</label>
                            <input type="text" id="rechargeUtr" placeholder="Enter UTR number" class="w-full bg-slate-900 border border-cardborder rounded-xl p-3 mt-1 text-xs font-bold text-white focus:outline-none focus:border-pink-500">
                        </div>
                        <div>
                            <label class="text-[11px] text-slate-400 font-semibold">Payment Screenshot</label>
                            <input type="file" id="rechargeScreenshot" class="w-full bg-slate-900 border border-cardborder rounded-xl p-3 mt-1 text-xs font-bold text-slate-300 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-pink-500/20 file:text-pink-400 hover:file:bg-pink-500/30">
                        </div>
                        <button onclick="submitRechargeForm()" class="w-full bg-gradient-to-r from-pink-500 to-indigo-600 py-3 rounded-xl font-extrabold text-xs shadow-xl tracking-wider">SUBMIT RECHARGE</button>
                        <button onclick="loadUserDashboard()" class="w-full bg-slate-800 py-2.5 rounded-xl font-bold text-xs text-slate-400">Back</button>
                    </div>
                </div>
            `;
        }

        async function submitRechargeForm() {
            const amount = document.getElementById('rechargeAmount').value;
            const utr = document.getElementById('rechargeUtr').value;
            const fileInput = document.getElementById('rechargeScreenshot');

            if (!utr || fileInput.files.length === 0) {
                alert("Please enter UTR and upload screenshot.");
                return;
            }

            const formData = new FormData();
            formData.append("amount", amount);
            formData.append("utr", utr);
            formData.append("screenshot", fileInput.files[0]);
            formData.append("initData", initData);

            const res = await apiCall('/api/wallet/recharge', 'POST', formData, true);
            if (res && res.status === 'success') {
                alert("Recharge request submitted successfully to admin!");
                loadUserDashboard();
            }
        }

        async function loadUserBookings() {
            const res = await apiCall('/api/user/data', 'GET', null);
            if (!res) return;
            let html = `<h2 class="text-sm font-extrabold mb-4 text-slate-200">My Bookings</h2><div class="space-y-3">`;
            res.bookings.forEach(b => {
                html += `
                    <div class="bg-cardbg border border-cardborder p-4 rounded-2xl flex justify-between items-center shadow-lg">
                        <div>
                            <p class="font-extrabold text-xs text-white">Booking: ${b.booking_id}</p>
                            <p class="text-[11px] text-slate-400 mt-1">Status: <span class="text-pink-400 font-bold">${b.status}</span></p>
                            <p class="text-[10px] text-slate-500 mt-0.5">${b.date} • ${b.time}</p>
                        </div>
                        ${b.status === 'accepted' || b.status === 'active' ? `<button onclick="joinVideoCall('${b.booking_id}')" class="bg-emerald-600 px-3 py-2 rounded-xl text-xs font-bold shadow">Join Call</button>` : ''}
                    </div>
                `;
            });
            html += `</div><button onclick="loadUserDashboard()" class="mt-4 w-full bg-slate-800 py-2.5 rounded-xl text-xs font-bold text-slate-400">Back Home</button>`;
            document.getElementById('appContainer').innerHTML = html;
        }

        async function joinVideoCall(bookingId) {
            await apiCall('/api/call/join', 'POST', { booking_id: bookingId });
            document.getElementById('appContainer').innerHTML = `
                <div class="fixed inset-0 bg-slate-950 z-50 flex flex-col justify-between p-4">
                    <div class="flex justify-between items-center bg-cardbg p-3 rounded-xl border border-cardborder">
                        <span class="text-emerald-400 text-xs font-bold flex items-center"><span class="w-2 h-2 bg-emerald-500 rounded-full animate-ping mr-2"></span> Connected Live</span>
                    </div>
                    <div class="flex-1 my-4 bg-slate-900 rounded-2xl flex items-center justify-center border border-cardborder">
                        <p class="text-slate-400 text-xs animate-pulse">Agora WebRTC Video Call Active</p>
                    </div>
                    <div class="flex justify-center p-2 bg-cardbg rounded-2xl border border-cardborder">
                        <button onclick="endVideoCall('${bookingId}')" class="bg-red-600 px-6 py-3 rounded-full font-bold text-xs shadow-xl flex items-center space-x-2"><i class="fa-solid fa-phone-slash"></i><span>End Call</span></button>
                    </div>
                </div>
            `;
        }

        async function endVideoCall(bookingId) {
            await apiCall('/api/call/end', 'POST', { booking_id: bookingId });
            alert("Call completed successfully.");
            loadUserDashboard();
        }

        window.onload = initApp;
    </script>
</body>
</html>
