<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">

<style>
:root{--bg:#090712;--card:#151126;--card2:#1c1634;--text:#f7f4ff;--muted:#a9a2bd;--primary:#8b5cf6;--primary2:#ec4899;--green:#35d07f;--red:#ff5c75;--line:#2b2344;--gold:#f5c451;--shadow:0 16px 40px rgba(0,0,0,.28)}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh;padding-bottom:82px}button,input,select,textarea{font:inherit}button.card{color:#f7f4ff;text-align:center}button.recharge-plan{color:#f7f4ff}button{border:0;cursor:pointer}.app{max-width:720px;margin:auto;padding:14px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.brand{display:flex;align-items:center;gap:9px;font-weight:950;font-size:22px;letter-spacing:.2px}.vlogo{width:34px;height:34px;filter:drop-shadow(0 0 9px rgba(236,72,153,.45))}.brand-text{background:linear-gradient(90deg,#fff,#c084fc 55%,#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent}.brand span{color:#c084fc}.balance{background:linear-gradient(135deg,#211745,#30205a);border:1px solid #4c3678;border-radius:16px;padding:8px 12px;font-weight:800}.card{background:linear-gradient(180deg,#1a2440,#121a30);border:1px solid #344663;border-radius:20px;padding:15px;margin:12px 0;box-shadow:var(--shadow)}.hero{background:linear-gradient(135deg,#27124f,#17203f 55%,#311335);border:1px solid #49316b;padding:20px;border-radius:24px}.hero-banner{width:100%;height:auto;display:block;border-radius:20px;border:1px solid #49316b;box-shadow:0 12px 32px rgba(0,0,0,.28);object-fit:contain;background:#0b0715}.hero-actions{margin-top:10px}.hero h1{margin:0 0 7px;font-size:25px}.hero p{margin:0;color:#c9c1db;line-height:1.5}.row{display:flex;gap:10px;align-items:center}.between{display:flex;align-items:center;justify-content:space-between;gap:10px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.muted{color:var(--muted)}.small{font-size:12px}.title{font-size:17px;font-weight:900;margin:18px 0 10px}.btn{background:linear-gradient(135deg,var(--primary),var(--primary2));color:white;padding:12px 15px;border-radius:14px;font-weight:800;width:100%}.btn.secondary{background:#211a37;border:1px solid #3a2e59}.btn.green{background:linear-gradient(135deg,#1fa968,#2ddf91)}.btn.red{background:linear-gradient(135deg,#dc3757,#ff6a7e)}.btn.gold{background:linear-gradient(135deg,#c58b1b,#f4ca55);color:#1c1404}.btn:disabled{opacity:.45}.pill{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:900;background:#241b3d;color:#d7cced;border:1px solid #3a2d59}.online{color:#62f19c}.offline{color:#9690a3}.host{display:flex;gap:12px;align-items:center}.avatar{width:58px;height:58px;border-radius:17px;object-fit:cover;background:#282039;display:grid;place-items:center;font-size:24px;flex:0 0 auto}.host-info{min-width:0;flex:1}.host-name{font-weight:900;font-size:16px}.host-user{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.actions{display:flex;gap:8px;margin-top:11px}.actions .btn{flex:1}.notice{background:#1b1430;border:1px solid #4a356d;padding:12px;border-radius:15px;margin:10px 0;line-height:1.45}.empty{text-align:center;padding:25px;color:var(--muted)}.nav{position:fixed;z-index:20;left:0;right:0;bottom:0;background:rgba(12,9,22,.95);backdrop-filter:blur(15px);border-top:1px solid var(--line);padding:8px max(8px,env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center}.navin{max-width:720px;width:100%;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.nav button{background:transparent;color:#c7c1d6;padding:7px 3px;border-radius:12px;font-size:11px;font-weight:800}.nav button.active{background:#2a2050;color:white;border:1px solid #7048a8;box-shadow:0 0 14px rgba(168,85,247,.22)}.nav b{display:block;font-size:19px;margin-bottom:2px}.page{display:none}.page.active{display:block}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:50;display:none;align-items:flex-end}.modal.show{display:flex}.sheet{width:100%;max-width:720px;margin:auto;background:#110d20;border:1px solid #33284c;border-radius:25px 25px 0 0;padding:17px;max-height:90vh;overflow:auto}.field{margin:10px 0}.field label{display:block;font-size:12px;color:#aaa2bc;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;background:#202d49;color:#ffffff;border:1px solid #3b3055;border-radius:13px;padding:12px;outline:none}.field textarea{min-height:90px;resize:vertical}.duration{padding:11px;border-radius:13px;background:#19142b;border:1px solid #34294e;color:#ddd;text-align:center;font-weight:800}.duration.sel{border-color:#a855f7;background:#2a1a4d;color:white}.toast{position:fixed;z-index:100;left:50%;bottom:92px;transform:translateX(-50%) translateY(20px);opacity:0;background:#211a32;border:1px solid #493967;padding:12px 15px;border-radius:14px;max-width:90%;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.call{position:fixed;inset:0;background:#050408;z-index:80;display:none}.call.show{display:block}.remote{position:absolute;inset:0}.remote>div{width:100%;height:100%}.local{position:absolute;right:14px;top:52px;width:118px;height:165px;border-radius:16px;overflow:hidden;background:#17121f;border:1px solid #514463;z-index:3}.local>div{width:100%;height:100%}.calltop{position:absolute;z-index:4;left:15px;right:15px;top:15px;display:flex;justify-content:space-between;align-items:center}.callbadge{background:rgba(0,0,0,.45);backdrop-filter:blur(8px);padding:8px 11px;border-radius:12px}.callbottom{position:absolute;z-index:4;left:15px;right:15px;bottom:calc(20px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:12px}.circle{width:55px;height:55px;border-radius:50%;display:grid;place-items:center;background:#2a2434;color:white;font-size:21px}.circle.end{background:#e33d58}.timer{font-size:18px;font-weight:900}.hidden{display:none!important}.stat{padding:13px;border-radius:15px;background:#202d49;border:1px solid #48607f;color:#f7f4ff}.stat strong{font-size:20px;display:block}.recharge-plan{padding:13px;border-radius:15px;background:#202d49;border:1px solid #48607f;text-align:center;color:#f7f4ff;box-shadow:0 0 0 1px rgba(96,165,250,.05),0 8px 22px rgba(0,0,0,.22)}.recharge-plan.sel{border-color:#9b5cff;background:#2a1b4a}.gift{padding:13px;border-radius:16px;background:#19142b;border:1px solid #34294e;text-align:center}.gift .emoji{font-size:29px}.history{padding:12px;border-bottom:1px solid #2a2340}.history:last-child{border-bottom:0}.status{font-size:11px;font-weight:900}.status.completed,.status.accepted,.status.scheduled,.status.calling{color:#61e998}.status.rejected,.status.cancelled{color:#ff7086}.status.pending{color:#f5c451}.announcement{border-color:#6943a0;background:linear-gradient(135deg,#24153f,#1b1530)}
.qrbox{margin:14px auto;padding:15px;width:max-content;max-width:100%;background:#fff;border:2px solid #7c3aed;border-radius:20px;box-shadow:0 0 25px rgba(139,92,246,.35);text-align:center}.qrbox img{display:block;width:220px;height:220px;max-width:100%;object-fit:contain;margin:auto}.qrtitle{color:#111;font-weight:950;font-size:12px;letter-spacing:1.5px;margin-bottom:8px}.verified{display:inline-flex;align-items:center;gap:4px;margin-top:4px;padding:4px 8px;border-radius:999px;background:#103b2b;color:#6ff3aa;border:1px solid #2aa56d;font-size:11px;font-weight:900}.profile-avatar{width:72px;height:72px;border-radius:20px;object-fit:cover;background:#263858;border:2px solid #4b6387}.photo-preview{max-width:110px;max-height:110px;border-radius:16px;margin-top:8px;border:2px solid #4b6387}.modal .avatar{margin:auto;width:88px;height:88px;border-radius:22px}.recharge-plan b,.card b,.title,.section-title{color:#fff}.safe-note{background:#1b2a43;border:1px solid #466083;color:#eef4ff;padding:12px;border-radius:14px}.host-real{border-color:#3e6a8e;box-shadow:0 0 0 1px rgba(80,180,255,.08),0 12px 30px rgba(0,0,0,.24)}@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="brand"><img class="vlogo" src="/vynora-icon.png" alt="Vynora Live logo" loading="eager"><span class="brand-text">Vynora Live</span></div><div class="balance">🪙 <span id="topTokens">0</span></div></div>

  <section id="home" class="page active">
    <div id="announcement" class="notice announcement hidden"></div>
    <div class="hero"><img class="hero-banner" src="/vynora-banner.png" alt="Vynora Live private video call banner" loading="eager"><div class="actions hero-actions"><button class="btn" onclick="go('hosts')">🎥 Find Host</button><button class="btn secondary" onclick="go('wallet')">🪙 Recharge</button></div></div>
    <div class="title">Quick Access</div>
    <div class="grid">
      <button class="card" onclick="go('hosts')">🎥<br><b>Hosts</b><br><span class="small muted">Online hosts</span></button>
      <button class="card" onclick="go('bookings')">📅<br><b>Bookings</b><br><span class="small muted">Your calls</span></button>
      <button class="card" onclick="go('wallet')">💳<br><b>Wallet</b><br><span class="small muted">Recharge</span></button>
      <button class="card" onclick="go('profile')">👤<br><b>Profile</b><br><span class="small muted">Account</span></button>
    </div>
    <div id="hostHome" class="card hidden"></div>
    <div id="adminHome" class="card hidden"></div>
  </section>

  <section id="hosts" class="page"><div class="between"><div class="title">Available Hosts</div><button class="pill" onclick="loadHosts()">↻ Refresh</button></div><div id="hostList"></div></section>

  <section id="bookings" class="page"><div class="title">My Bookings</div><div id="bookingList"></div></section>

  <section id="wallet" class="page">
    <div class="card"><div class="muted small">Available Coins</div><div style="font-size:31px;font-weight:950;margin-top:3px">🪙 <span id="walletTokens">0</span></div></div>
    <div class="title">Recharge Coins</div>
    <div id="rechargePlans" class="grid"></div>
    <div class="card"><div class="between"><b>Payment</b><span class="pill">UPI</span></div><p class="small muted">UPI ID: <b id="upiId">vynoralive@slc</b><br>Name: <b id="upiName">Rajnish Kumar</b></p><button class="btn secondary" onclick="copyUPI()">📋 Copy UPI ID</button></div>
    <div class="title">Host Withdrawal</div><div id="withdrawBox"></div>
  </section>

  <section id="profile" class="page"><div id="profileBox"></div><div class="title">Support & Settings</div><div class="grid"><button class="card" onclick="openSupport()">🆘<br><b>Primary Support</b><br><span class="small muted">@Vynoraagent</span></button><button class="card" onclick="openOfficialHead()">👑<br><b>Official Head Admin</b><br><span class="small muted">@VynoraSupport</span></button></div><div class="safe-note">💬 Support: <b>@Vynoraagent</b> · 👑 Official Head Admin: <b>@VynoraSupport</b></div><div class="title">Host</div><button class="card" style="width:100%" onclick="openHostApply()">🎙️ <b id="hostApplyText">Become a Host</b></button><div id="adminBox"></div></section>
</div>

<div class="nav"><div class="navin"><button onclick="go('home')" data-nav="home"><b>⌂</b>Home</button><button onclick="go('hosts')" data-nav="hosts"><b>👥</b>Hosts</button><button onclick="go('bookings')" data-nav="bookings"><b>📅</b>Bookings</button><button onclick="go('wallet')" data-nav="wallet"><b>🪙</b>Wallet</button><button onclick="go('profile')" data-nav="profile"><b>👤</b>Profile</button></div></div>

<div id="modal" class="modal"><div class="sheet" id="sheet"></div></div>
<div id="toast" class="toast"></div>

<div id="callScreen" class="call">
  <div id="remoteVideo" class="remote"></div><div id="localVideo" class="local"></div>
  <div class="calltop"><div class="callbadge"><b id="callName">Vynora Call</b><br><span class="small" id="callState">Connecting…</span></div><div class="callbadge timer" id="callTimer">00:00</div></div>
  <div class="callbottom"><button class="circle" id="micBtn" onclick="toggleMic()">🎙️</button><button class="circle" id="camBtn" onclick="toggleCam()">📹</button><button class="circle" onclick="switchCamera()">🔄</button><button class="circle end" onclick="endCurrentCall()">☎</button></div>
</div>

<script>
const API='';
const tg=window.Telegram?.WebApp;
try{tg?.ready();tg?.expand();tg?.setHeaderColor?.('#090712');tg?.setBackgroundColor?.('#090712')}catch(e){}
let initData=tg?.initData||'';
let me=null,config=null,hosts=[],selectedHost=null,selectedMinutes=1,selectedRecharge=null,selectedBooking=null;
let agoraClient=null,localTracks=[],callPoll=null,callTimerInterval=null,currentCallBooking=null,currentCallId=null,currentCallType=null,micOn=true,camOn=true,remoteMediaReadyResolve=null;

function $(id){return document.getElementById(id)}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>$('toast').classList.remove('show'),3000)}
function fmtTime(ts){if(!ts)return '-';return new Date(Number(ts)*1000).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'})}
function fmtDur(sec){sec=Math.max(0,Math.floor(sec||0));return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function errorText(v){if(v==null)return '';if(typeof v==='string')return v;if(Array.isArray(v))return v.map(x=>typeof x==='string'?x:(x?.msg||x?.detail||JSON.stringify(x))).join(', ');if(typeof v==='object')return v.msg||v.message||v.detail||JSON.stringify(v);return String(v)}
function api(path,opt={}){initData=tg?.initData||initData||'';const h=new Headers(opt.headers||{});if(initData)h.set('X-Telegram-Init-Data',initData);return fetch(API+path,{...opt,headers:h}).then(async r=>{let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(errorText(d.detail)||errorText(d.message)||`HTTP ${r.status}`);return d})}
function jsonApi(path,body){return api(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})}
function openModal(html){$('sheet').innerHTML=html;$('modal').classList.add('show')}
function closeModal(){$('modal').classList.remove('show');$('sheet').innerHTML=''}
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()})
function go(page){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(page).classList.add('active');document.querySelectorAll('[data-nav]').forEach(x=>x.classList.toggle('active',x.dataset.nav===page));if(page==='hosts')loadHosts();if(page==='bookings')loadBookings();if(page==='wallet')renderWallet();if(page==='profile')renderProfile();window.scrollTo(0,0)}
function photo(url,name){const u=url||'';return u?`<img class="avatar" src="${esc(u)}" loading="eager" onerror="this.onerror=null;this.outerHTML='<div class=avatar>👤</div>'">`:`<div class="avatar">${esc((name||'U').slice(0,1).toUpperCase())}</div>`}

async function boot(){
  try{tg?.ready();tg?.expand();initData=tg?.initData||initData||'';await new Promise(r=>setTimeout(r,250));initData=tg?.initData||initData||'';}catch(e){}
  if(!initData){toast('⚠️ Telegram session नहीं मिला। कृपया Bot में /start → Open Vynora Live से खोलें।');return}
  try{
    config=await api('/api/config');
    $('upiId').textContent=config.upi_id||'vynoralive@slc';$('upiName').textContent=config.upi_name||'Rajnish Kumar';
    const u=tg?.initDataUnsafe?.user||{};
    const start=await jsonApi('/api/start',{user_id:Number(u.id||0),name:[u.first_name,u.last_name].filter(Boolean).join(' ')||'User',username:u.username||'',country:'IN',initData:initData});
    me=start.user;
    await refreshUser();
    await loadAnnouncement();
    await loadHosts();
    renderProfile();
    renderHome();
    renderWallet();
    pollIncoming();
    setInterval(pollIncoming,5000);
  }catch(e){toast('❌ '+e.message)}
}
async function refreshUser(){const u=tg?.initDataUnsafe?.user||{};const d=await api('/api/user/'+Number(u.id));me=d.user;me.host=d.host;me.is_admin=d.is_admin;updateBalance()}
function updateBalance(){$('topTokens').textContent=Number(me?.tokens||0).toLocaleString('en-IN');$('walletTokens').textContent=Number(me?.tokens||0).toLocaleString('en-IN')}
async function loadAnnouncement(){try{const d=await api('/api/announcement');if(d.message){$('announcement').innerHTML='📢 <b>Announcement</b><br>'+esc(d.message);$('announcement').classList.remove('hidden')}}catch(e){}}
function renderHome(){
  if(me?.host?.status==='approved'){$('hostHome').classList.remove('hidden');$('hostHome').innerHTML=`<div class="between"><b>🎙️ Host Dashboard</b><span class="pill ${me.host.online?'online':'offline'}">${me.host.online?'🟢 ONLINE':'⚫ OFFLINE'}</span></div><p class="small muted">✓ VYNORA VERIFIED HOST · Booking requests, schedule और call management.</p><div class="actions"><button class="btn ${me.host.online?'red':'green'}" onclick="toggleHostOnline()">${me.host.online?'GO OFFLINE':'GO ONLINE'}</button><button class="btn secondary" onclick="go('bookings')">Bookings</button></div>`}
  if(me?.is_admin){$('adminHome').classList.remove('hidden');$('adminHome').innerHTML='<b>👑 VYNORA LIVE — OFFICIAL HEAD ADMIN</b><p class="small muted">Admin dashboard Profile में उपलब्ध है.</p><button class="btn" onclick="go(\'profile\');renderAdmin()">Open Admin</button>'}
}

async function loadHosts(){
  try{hosts=await api('/api/hosts');renderHosts()}catch(e){$('hostList').innerHTML=`<div class="empty">❌ ${esc(e.message)}</div>`}
}
function renderHosts(){
  const real=hosts.filter(h=>String(h.country||'IN').toUpperCase()==='IN'&&!h.demo);
  const online=real.filter(h=>h.online), offline=real.filter(h=>!h.online);
  let html='';
  if(online.length)html+='<div class="title">🟢 Online Vynora Hosts</div>'+online.map(hostCard).join('');
  if(offline.length)html+='<div class="title">⚫ Approved Hosts (Offline)</div>'+offline.map(hostCard).join('');
  $('hostList').innerHTML=html||'<div class="empty">अभी कोई real approved Host नहीं है.<br><span class="small">Host approve होने के बाद यहाँ दिखाई देगा. Online होने पर Book Slot खुलेगा.</span></div>';
}
function isIndiaHost(h){const c=String(h?.country||h?.country_name||'IN').trim().toUpperCase();return c==='IN'||c==='INDIA'||c==='🇮🇳'}
function hostCard(h){const allowed=isIndiaHost(h)&&!h.demo;const verified=h.verified||h.status==='approved';const tid=Number(h.user_id);return `<div class="card ${allowed?'host-real':''}"><div class="host">${photo(h.photo_url,h.name)}<div class="host-info"><div class="host-name">${esc(h.name||'Host')} ${h.online?'<span class=online>●</span>':'<span class=offline>●</span>'}</div>${verified?'<div class=verified>✓ VYNORA VERIFIED HOST</div>':''}<div class="host-user">${esc(h.country_name||'India')}</div><div class="small ${h.online?'online':'offline'}">${h.online?'🟢 ONLINE':'⚫ OFFLINE'}</div></div></div><div class="actions"><button class="btn secondary" onclick="viewHost(${tid})">View</button><button class="btn" ${(!allowed||!h.online)?'disabled':''} onclick="openBooking(${tid})">${!allowed?'Not Available':!h.online?'Offline':'Book Slot'}</button></div></div>`}
async function viewHost(id){try{selectedHost=await api('/api/host/'+id);const canBook=isIndiaHost(selectedHost)&&!selectedHost.demo&&selectedHost.online;openModal(`<div class="between"><h2 style="margin:0">${esc(selectedHost.name)}</h2><button class="pill" onclick="closeModal()">✕</button></div><div style="text-align:center;margin:15px 0">${photo(selectedHost.photo_url,selectedHost.name)}${selectedHost.verified?'<div class=verified style="margin:10px auto 0">✓ VYNORA VERIFIED HOST</div>':''}<p class="muted">India-based verified Host</p><span class="pill ${selectedHost.online?'online':'offline'}">${selectedHost.online?'🟢 ONLINE':'⚫ OFFLINE'}</span></div><div class="safe-note">🛡️ Vynora Verified Host · Private 1-to-1 video calling · ${esc(selectedHost.country_name||'India')}-based Host</div><p class="small muted">India-based Host के साथ 1-to-1 private video call. Booking rates duration के अनुसार हैं.</p><button class="btn" ${canBook?'':'disabled'} onclick="closeModal();openBooking(${id})">📅 ${canBook?'Book Slot':'Not Available'}</button>`)}catch(e){toast('❌ '+errorText(e.message))}}
function openBooking(hostId){
  const h=hosts.find(x=>Number(x.user_id)===Number(hostId))||selectedHost;if(!h)return;
  if(!isIndiaHost(h)||h.demo){toast('⚠️ यह real India Host नहीं है।');return}
  if(!h.online){toast('⚫ Host अभी offline है। Online Host चुनें।');return}
  selectedHost=h;const plans=(config?.booking_plans||[]).slice().sort((a,b)=>Number(a.minutes)-Number(b.minutes));
  const oneMinUsed=Boolean(me?.one_minute_used);
  const minDate=new Date(Date.now()+2*60*1000);minDate.setSeconds(0,0);const local=new Date(minDate.getTime()-minDate.getTimezoneOffset()*60000).toISOString().slice(0,16);
  const first=plans.find(p=>!(Number(p.minutes)===1&&Number(p.tokens)===20&&oneMinUsed))||plans[0];
  selectedMinutes=Number(first?.minutes||1);

async function initAgora(channel){
  if(!window.AgoraRTC)throw new Error('Agora SDK load नहीं हुआ');
  await cleanupAgora(false);let st;try{st=await api('/api/agora-status')}catch(e){st=null}if(st&&!st.configured){throw new Error('Agora setup incomplete: '+(st.message||'Render environment variables check करें'))}let td;try{td=await api('/api/agora-token?channelName='+encodeURIComponent(channel)+'&uid='+me.user_id+'&role=publisher&booking_id='+encodeURIComponent(currentCallBooking||''))}catch(e){throw new Error(errorText(e.message))}
  agoraClient=AgoraRTC.createClient({mode:'rtc',codec:'vp8'});
  // Do not wait for the other participant's video/audio media before
  // registering this participant as connected. Agora can deliver media a
  // little later (camera permission, network, device startup, etc.). The
  // backend starts the paid timer only after BOTH browsers have joined Agora
  // and called /api/call/connect. This removes the false "call connect"
  // failure while preserving the exact two-person timer rule.
  let remoteJoined=false;
  agoraClient.on('user-joined',(user)=>{
    remoteJoined=true;
    $('callState').textContent='Participant connected • starting when both are ready…';
  });
  agoraClient.on('user-published',async(user,mediaType)=>{
    try{
      await agoraClient.subscribe(user,mediaType);
      if(mediaType==='video'&&user.videoTrack){user.videoTrack.play('remoteVideo')}
      if(mediaType==='audio'&&user.audioTrack){user.audioTrack.play()}
    }catch(e){logCallError(e)}
  });
  agoraClient.on('user-left',()=>{
    remoteJoined=false;
    if(!currentCallBooking)return;
    $('callState').textContent='Participant disconnected…';
  });
  agoraClient.on('connection-state-change',(cur,prev,reason)=>{
    if(cur==='DISCONNECTED'||cur==='FAILED'){$('callState').textContent='Connection lost'}
  });
  await agoraClient.join(td.appId,channel,td.token,Number(td.uid));
  let mic,cam;try{mic=await AgoraRTC.createMicrophoneAudioTrack();cam=await AgoraRTC.createCameraVideoTrack()}catch(e){throw new Error('Camera/Microphone permission दें और फिर Call Join करें')}
  localTracks=[mic,cam];micOn=true;camOn=true;cam.play('localVideo');await agoraClient.publish([mic,cam]);$('micBtn').textContent='🎙️';$('camBtn').textContent='📹';
  $('callState').textContent='Waiting for both participants…';
  // This browser has now joined Agora and published its local tracks.
  // Register immediately; the server will start the paid timer only when the
  // OTHER participant has also registered. We intentionally do not wait for
  // remote video/audio here because media can arrive after the Agora join.
  await jsonApi('/api/call/connect',{booking_id:id,user_id:me.user_id});
}

async function cleanupAgora(hide=true){clearInterval(callPoll);callPoll=null;clearInterval(callTimerInterval);callTimerInterval=null;remoteMediaReadyResolve=null;try{localTracks.forEach(t=>{try{t.stop();t.close()}catch(e){}});localTracks=[];if(agoraClient)await agoraClient.leave()}catch(e){}agoraClient=null;if(hide){$('remoteVideo').innerHTML='';$('localVideo').innerHTML=''}}

function openAdminCall(){openModal(`<h2 style="margin-top:0">📞 Admin Direct Call</h2><p class="small muted">Free call. No coins and no time limit.</p><div class="field"><label>User / Host Telegram ID</label><input id="adminTarget" type="number" placeholder="Telegram ID"></div><button class="btn" onclick="startAdminDirectCall()">Call Now</button>`)}
async function startAdminDirectCall(){try{const target=Number($('adminTarget').value);if(!target)throw new Error('Target ID डालें');const d=await jsonApi('/api/admin/direct-call',{admin_id:me.user_id,target_id:target});closeModal();await startDirectCall(d.call_id,d.channel);toast('📞 Direct call started')}catch(e){toast('❌ '+e.message)}}
async function loadAdminCalls(){try{const d=await api('/api/admin/direct-calls/'+me.user_id);openModal(`<h2 style="margin-top:0">📞 Direct Calls</h2>${d.length?d.map(x=>`<div class="history"><b>${x.target_id}</b><br><span class="small muted">${x.status} · ${fmtTime(x.created_at)}</span>${x.status!=='ended'?`<button class="btn" style="margin-top:8px" onclick="closeModal();startDirectCall('${x.call_id}','${x.channel}')">Join</button>`:''}</div>`).join(''):'<div class=empty>No calls</div>'}`)}catch(e){toast('❌ '+e.message)}}
async function startDirectCall(callId,channel){currentCallId=callId;currentCallType='admin';$('callName').textContent='👑 Vynora Admin Call';$('callState').textContent='Free • No time limit';$('callTimer').textContent='FREE';$('callScreen').classList.add('show');try{await jsonApi('/api/direct-call/join/'+callId+'?user_id='+me.user_id,{});await initAgora(channel)}catch(e){toast('❌ '+e.message);await leaveDirectCall()}}
async function leaveDirectCall(){const id=currentCallId;try{if(id)await api('/api/direct-call/end/'+id+'?user_id='+me.user_id,{method:'POST'})}catch(e){}await cleanupAgora(true);$('callScreen').classList.remove('show');currentCallId=null;currentCallType=null}

async function checkDirectForCall(){if(!me)return;try{const d=await api('/api/direct-call/pending/'+me.user_id);if(d.active&&!currentCallId){const c=d.call;if(c.status==='ringing'){openModal(`<div style="text-align:center"><div style="font-size:45px">👑</div><h2>Admin Call</h2><p>VYNORA SUPER ADMIN wants to speak with you.</p><div class="notice">Free call · No coins · No time limit</div><button class="btn green" onclick="closeModal();startDirectCall('${c.call_id}','${c.channel}')">📞 Accept Admin Call</button></div>`);}}}catch(e){}}

async function syncHostStatus(){if(!me)return;try{const before=me.host?.status;await refreshUser();if(me.host?.status!==before){renderHome();renderProfile();await loadHosts();}}catch(e){}}
setInterval(()=>{if(me)checkDirectForCall()},5000);
setInterval(()=>{if(me && me.host?.status!=='approved')syncHostStatus()},5000);
try{document.addEventListener('visibilitychange',()=>{if(!document.hidden){try{tg?.ready();}catch(e){} initData=tg?.initData||initData||'';}})}catch(e){}
boot();
</script>
</body>
</html>
